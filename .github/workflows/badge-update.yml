name: Update README badge

on:
  workflow_run:
    workflows: ["Update STATUS last_updated"]
    types:
      - completed

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read date from STATUS.md
        id: date
        run: |
          DATE=$(grep '^last_updated:' STATUS.md | sed 's/last_updated: "\(.*\)"/\1/')
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Update badge in README
        run: |
          DATE=${{ steps.date.outputs.date }}
          ESCAPED_DATE=$(echo "$DATE" | sed 's/-/--/g')
          sed -i -E "s#https://img.shields.io/badge/Last_Update-[^-]*-brightgreen#https://img.shields.io/badge/Last_Update-${ESCAPED_DATE}-4B0082#g" README.md

      - name: Commit & push badge update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(badge): refresh last update badge"
          git push
